name: unit-tests

on:
  pull_request:
    paths:
      - 'app/**'
      - 'tests/unit/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/unit-tests.yml'
  push:
    branches:
      - main
      - integration/main-canonical-v2
      - integration/al-manara-migration
    paths:
      - 'app/**'
      - 'tests/unit/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/unit-tests.yml'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'

      - name: Run unit tests
        run: python -m pytest tests/unit -q
